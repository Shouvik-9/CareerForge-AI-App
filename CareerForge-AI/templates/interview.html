<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Interviewer - CareerForage AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

<header class="navbar">

    <div class="logo">
        CareerForage AI
    </div>

    <nav>

        <a href="{{ url_for('home') }}">
            Home
        </a>

              <a href="{{ url_for('job_match') }}">
            Job Matcher
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </nav>

</header>


<main class="interview-page">

    <section class="interview-container">

        <h1>AI Interviewer</h1>

        <p>
            Practice technical and HR interviews
            with your personal AI interviewer.
        </p>


        <form method="POST">

            <div class="form-group">

                <label for="role">
                    Target Job Role
                </label>

                <input
                    type="text"
                    id="role"
                    name="role"
                    placeholder="e.g. AI Engineer"
                    required
                >

            </div>


            <div class="form-group">

                <label for="interview_type">
                    Interview Type
                </label>

                <select
                    id="interview_type"
                    name="interview_type"
                    required
                >

                    <option value="">
                        Select interview type
                    </option>

                    <option value="technical">
                        Technical
                    </option>

                    <option value="hr">
                        HR
                    </option>

                    <option value="mixed">
                        Technical + HR
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Start Interview
            </button>

        </form>

    </section>

</main>


<footer>

    <p>
        © 2026 CareerForage AI. All rights reserved.
    </p>

</footer>

</body>

</html>
